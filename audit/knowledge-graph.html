<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webhosting-scripts — Knowledge Graph</title>
<style>
  :root{
    --bg:#0c1118; --panel:#141d28; --panel2:#1b2735; --line:#28384a;
    --ink:#e6edf3; --muted:#9fb0c0; --faint:#6b7d8f; --accent:#3fb6ff;

  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100vh;width:100vw}

  /* sidebar */
  #side{width:320px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .hd{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .hd h1{margin:0;font-size:16px;letter-spacing:.2px}
  .hd p{margin:4px 0 0;font-size:11.5px;color:var(--faint)}
  .scroll{overflow-y:auto;padding:14px 16px;flex:1}
  .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);margin:4px 0 8px}
  #search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none}
  #search:focus{border-color:var(--accent)}
  #results{margin:6px 0 0;max-height:150px;overflow-y:auto}
  #results div{padding:5px 8px;font-size:12px;border-radius:6px;cursor:pointer;color:var(--muted)}
  #results div:hover{background:var(--panel2);color:var(--ink)}

  .legend{margin-top:14px}
  .leg{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
  .leg:hover{background:var(--panel2)}
  .leg.off{opacity:.35}
  .swatch{width:11px;height:11px;border-radius:3px;flex:none}
  .leg .cnt{margin-left:auto;font-size:10.5px;color:var(--faint)}

  /* detail */
  #detail{border-top:1px solid var(--line);padding:14px 16px;max-height:46%;overflow-y:auto;display:none}
  #detail.show{display:block}
  #detail .dgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;display:inline-block;padding:2px 8px;border-radius:5px;font-weight:700;margin-bottom:8px}
  #detail h2{margin:0 0 4px;font-size:15.5px}
  #detail .file{font-family:var(--mono);font-size:11px;color:var(--accent);word-break:break-all;margin-bottom:8px}
  #detail .desc{font-size:12.5px;color:var(--ink);line-height:1.5}
  #detail .tracelink{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:#fbbf24;text-decoration:none;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);padding:6px 10px;border-radius:7px}
  #detail .tracelink:hover{background:rgba(251,191,36,.16)}
  #detail .rel{font-size:11.5px;color:var(--muted);margin:6px 0;padding-left:14px;position:relative}
  #detail .rel::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  #detail .rel b{color:var(--ink);font-weight:600}
  #detail .rel .r{color:var(--faint);font-style:italic}
  .relhd{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin:12px 0 4px}

  /* canvas */
  #stage{flex:1;position:relative}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  #tip{position:absolute;pointer-events:none;background:#0a0f16;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;max-width:260px;display:none;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip .tn{font-weight:700;margin-bottom:2px}
  #tip .td{color:var(--muted);font-size:11.5px;line-height:1.4}
  #hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--faint);background:rgba(10,15,22,.7);border:1px solid var(--line);border-radius:8px;padding:7px 11px;pointer-events:none}
  #stat{position:absolute;right:14px;top:12px;font-size:11px;color:var(--faint);background:rgba(10,15,22,.7);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .btnrow{display:flex;gap:6px;margin-top:10px}
  .btn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:6px;font-size:11.5px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
</style>
</head>

    {
      "id": "wh-db-refresh-export",
      "label": "wh-db-refresh-export",
      "group": "dbrefresh",
      "file": "wh-scripts/wh-db-refresh-export.sh",
      "desc": "Exports the current site's WordPress database as a hand-off bundle for a sibling site on the same server under a different unix user (prod → staging). Run as the source site's own user. Pre-flights options/setfacl/free space (needs ~2x the DB size in /tmp), dumps every prefixed table except --exclude via wp-cli mysqldump (--single-transaction so the live source is never locked, --set-gtid-purged=OFF to avoid needing SUPER on import), refuses to hand off a dump lacking the '-- Dump completed' tail, writes a manifest (table list, key row counts, source URL, core/db version, true dump byte size, views), then tars both into /tmp mode 600 under umask 077 with exactly one setfacl reader (--grant-user) — verified with getfacl before it is promised. Schedules its own deletion after --ttl minutes (default 120) via a detached sleeper whose liveness is checked. Any failure path removes everything via an EXIT trap.",
      "trace": ""
    },
    {
      "id": "wh-db-refresh-import",
      "label": "wh-db-refresh-import",
      "group": "dbrefresh",
      "file": "wh-scripts/wh-db-refresh-import.sh",
      "desc": "Imports a hand-off bundle into the current site, re-points URLs, and runs acceptance checks — replacing third-party DB-sync plugins. Run as the target site's own user; all site-specific behaviour comes from an unversioned '.wh-db-refresh' beside the site, never from defaults. Gates first (manifest source_url matches config, hand-off age, prefix match, EXPECT_EXCLUDED really absent, target core >= source, free space). Then WordPress maintenance mode (a .maintenance 503 before plugins/cron, re-stamped every 4 min by a keepalive so long imports stay covered and hard-killed runs self-recover), import, cache reset, truncates, optional cron clear, core update-db. URLs are re-pointed serialized-safe via one host pass plus a scheme pass. Acceptance prints PASS/FAIL/WARN/INFO and exits 1 on any FAIL; maintenance is lifted ONLY if every *safety* check passed (import complete, truncates done, host rewritten, canary armed) — otherwise the site stays down with a far-future stamp and the recovery command is printed. Options are read straight from MySQL throughout, never get_option(), so a persistent object cache cannot turn the checks into vacuous passes.",
      "trace": ""
    },
    {
      "id": ".wh-db-refresh.sample",
      "label": "db-refresh/.wh-db-refresh.sample",
      "group": "config",
      "file": "db-refresh/.wh-db-refresh.sample",
      "desc": "Reference config copied to '<site>/.wh-db-refresh' on the importing side: SOURCE_URL, TRUNCATE_TABLES, EXPECT_EXCLUDED, CANARY_OPTION (clone-guard), ROW_DRIFT_PCT, MAX_HANDOFF_AGE_HOURS, CLEAR_CRON, SKIP_CACHE_FLUSH.",
      "trace": ""
    },

      "trace": ""
    },
    {
      "id": "handoff-bundle",
      "label": "/tmp db-refresh hand-off",
      "group": "external",

      "desc": "The tar.gz bridging the two sites: manifest first (so the import can read it without unpacking the dump), then the SQL dump. Mode 600 plus a single setfacl read grant for the importing user; self-destructs on the exporter's TTL. Only its owner can delete it under sticky /tmp, which is why the export side self-cleans.",
      "trace": ""
    },
    {
      "id": "wp-cli",
      "label": "wp-cli + WordPress site/DB",
      "group": "external",
      "file": null,
      "desc": "The wp-cli phar, the site's WordPress install under WH_WEBROOT_DIR, and its MySQL database. One current phar per server (installed by wh-wp-install); what varies per site is only the PHP that executes it. wh-wp and both db-refresh commands invoke it as '$WH_PHP_CMD $WH_WP_PHAR --path=<webroot>' so it runs under the site's PHP, and read options via raw SQL rather than get_option().",
      "trace": ""
    },
    {
      "id": "wh-wp-install",
      "label": "wh-wp-install",
      "group": "platform",
      "file": "wh-scripts/wh-wp-install.sh",
      "desc": "Installs or updates the single per-server wp-cli phar at /usr/local/bin/wp, owned root:root 0755. Downloads the stable build, verifies it against the published .sha512, smoke-tests it against every phpX.Y on the box and reports which versions it runs under (wp-cli's supported window has an UPPER bound as well as a lower one, and some machines here default to a CLI php newer than any site targets), then stages and atomically moves it into place with sudo. Idempotent — a phar already matching the published checksum is left alone — so re-running IS the updater; root ownership is what stops a site user's 'wp cli update' from moving the shared binary out from under everyone. Also retires the two older shapes found on this fleet: a pinned '#!/bin/sh' wrapper at /usr/local/bin/wp and a phar parked at /usr/local/lib/wp-cli.phar. Stray copies under /home are reported, never touched.",
      "trace": "traces/06-platform-install-update.md"
    },
    {
      "id": "wh-wp",
      "label": "wh-wp",
      "group": "helper",
      "file": "wh-scripts/wh-wp.sh",
      "desc": "Runs wp-cli against the current site under the SITE's own PHP version: execs `$WH_PHP_CMD $WH_WP_PHAR --path=$WH_WEBROOT_DIR \"$@\"`. Matters more than the php/composer wrappers because wp-cli does not talk TO WordPress — it BOOTS the site's WordPress inside its own process, so every plugin, theme, core update-db migration and search-replace pass runs under whichever PHP started the phar. Unlike wh-php/wh-composer it FAILS CLOSED when WH_PHP_CMD is undetected (those run YOUR code under a default interpreter; this runs the SITE's code, where a guess is not a safe default). Also errors when no phar is installed (pointing at wh wp-install) and when the site is not WordPress. Injects --path from the nginx webroot unless the caller supplied one — accepting wp-config.php in or one level above the webroot, both layouts being present on this fleet — and warns when run by an admin account rather than the site's own user.",
      "trace": "traces/02-deployment-pipeline.md"
    },
    {
      "id": "wh-artisan",
      "label": "wh-artisan",
      "group": "helper",
      "file": "wh-scripts/wh-artisan.sh",
      "desc": "Runs Laravel artisan for the current project under the SITE's own PHP version: execs `$WH_PHP_CMD $WH_PROJECT_DIR/artisan \"$@\"`. artisan does not talk TO the application — it BOOTS it, so every service provider, queued job and migration executes under whichever PHP started artisan. Like wh-wp — and unlike wh-php/wh-composer — it FAILS CLOSED when WH_PHP_CMD is undetected: 'wh php artisan' warns and falls back to the default CLI PHP, i.e. booting the site's code under an interpreter the site never uses. Invokes artisan by full path, so it works from anywhere inside the project (even public/, where a bare 'php artisan' cannot find the file); the caller's cwd is preserved inside the project tree, and only from outside it (the cwd=$HOME site-auto-detect case) does it cd to the project root — the \"$PWD/\" prefix match is directory-boundary-safe. Errors when the project has no artisan file, and warns when run by an admin account rather than the site's own user, since anything artisan writes (storage/, bootstrap/cache/, the laravel.log) is then owned by that account. Additive: wh-composer-deploy still calls 'wh php artisan'.",
      "trace": "traces/02-deployment-pipeline.md"
    }

<script>
const GRAPH = JSON.parse(document.getElementById('graph-data').textContent);
const COLORS = {
  entry:'#ffd24a', deploy:'#ff9f43', docker:'#3fb6ff', backup:'#7c5cff',
  platform:'#37d39b', helper:'#22d3ee', observability:'#ff7ac6', diag:'#94a3b8',
  config:'#64748b', external:'#e0625f', dbrefresh:'#84cc16'
};
const GROUP_LABEL = {
  entry:'Entrypoint / dispatcher', deploy:'Deployment commands', docker:'Docker framework',
  backup:'Backup framework (restic)', platform:'Platform install / update', helper:'Helpers / wrappers',
  observability:'New Relic observability', diag:'Diagnostics / examples', config:'Config & templates',
  external:'External systems / server state', dbrefresh:'WordPress DB refresh'
};

// ---- build node/link model ----
const nodes = GRAPH.nodes.map(n => ({...n, x:0, y:0, vx:0, vy:0, deg:0}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const links = GRAPH.links.map(l => ({source:byId[l.s], target:byId[l.t], r:l.r})).filter(l => l.source && l.target);
links.forEach(l => { l.source.deg++; l.target.deg++; });

// adjacency for highlight
const adj = {}; nodes.forEach(n => adj[n.id] = new Set());
links.forEach(l => { adj[l.source.id].add(l.target.id); adj[l.target.id].add(l.source.id); });

// seed positions in a circle + small group clustering
const W0 = 1400, H0 = 1000;
nodes.forEach((n, i) => {
  const a = (i / nodes.length) * Math.PI * 2;
  const r = 300 + (i % 7) * 30;
  n.x = W0/2 + Math.cos(a) * r;
  n.y = H0/2 + Math.sin(a) * r;
});

// ---- canvas + camera ----
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let DPR = window.devicePixelRatio || 1;
let cam = {x:0, y:0, k:0.75};
function resize(){
  const st = document.getElementById('stage');
  cv.width = st.clientWidth * DPR; cv.height = st.clientHeight * DPR;
  cv.style.width = st.clientWidth+'px'; cv.style.height = st.clientHeight+'px';
}
window.addEventListener('resize', resize); resize();
// center camera initially
cam.x = cv.clientWidth/2 - (W0/2)*cam.k;
cam.y = cv.clientHeight/2 - (H0/2)*cam.k;

const hidden = new Set();          // hidden groups
let selected = null, hover = null, alpha = 1;

// ---- force simulation ----
function tick(){
  if (alpha < 0.005) return;
  const REP = 9000, SPRING = 0.012, LEN = 90, CENTER = 0.015;
  for (let i=0;i<nodes.length;i++){
    const a = nodes[i]; if (hidden.has(a.group)) continue;
    for (let j=i+1;j<nodes.length;j++){
      const b = nodes[j]; if (hidden.has(b.group)) continue;
      let dx = a.x-b.x, dy = a.y-b.y; let d2 = dx*dx+dy*dy || 0.01;
      if (d2 > 90000) continue;
      const d = Math.sqrt(d2); const f = REP/d2;
      const fx = (dx/d)*f, fy = (dy/d)*f;
      a.vx += fx*alpha; a.vy += fy*alpha; b.vx -= fx*alpha; b.vy -= fy*alpha;
    }
  }
  links.forEach(l => {
    const a = l.source, b = l.target;
    if (hidden.has(a.group) || hidden.has(b.group)) return;
    let dx = b.x-a.x, dy = b.y-a.y; const d = Math.sqrt(dx*dx+dy*dy)||0.01;
    const f = (d-LEN)*SPRING;
    const fx = (dx/d)*f, fy = (dy/d)*f;
    a.vx += fx*alpha; a.vy += fy*alpha; b.vx -= fx*alpha; b.vy -= fy*alpha;
  });
  nodes.forEach(n => {
    if (hidden.has(n.group)) return;
    n.vx += (W0/2 - n.x)*CENTER*alpha; n.vy += (H0/2 - n.y)*CENTER*alpha;
    if (n === dragNode) return;
    n.x += n.vx; n.y += n.vy; n.vx *= 0.82; n.vy *= 0.82;
  });
  alpha *= 0.992;
}

function world(px, py){ return {x:(px-cam.x)/cam.k, y:(py-cam.y)/cam.k}; }
function screen(wx, wy){ return {x:wx*cam.k+cam.x, y:wy*cam.k+cam.y}; }
function radius(n){ return 5 + Math.min(9, n.deg*0.9); }

function draw(){
  tick();
  ctx.save();
  ctx.scale(DPR, DPR);
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  ctx.translate(cam.x, cam.y); ctx.scale(cam.k, cam.k);

  const neigh = selected ? adj[selected.id] : null;
  // links
  links.forEach(l => {
    const a = l.source, b = l.target;
    if (hidden.has(a.group) || hidden.has(b.group)) return;
    let on = true;
    if (selected) on = (a.id===selected.id || b.id===selected.id);
    ctx.strokeStyle = on ? 'rgba(63,182,255,0.55)' : 'rgba(120,140,160,0.10)';
    ctx.lineWidth = (on ? 1.4 : 0.6)/cam.k;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  // nodes
  nodes.forEach(n => {
    if (hidden.has(n.group)) return;
    let dim = false;
    if (selected) dim = !(n.id===selected.id || neigh.has(n.id));
    const rr = radius(n);
    ctx.globalAlpha = dim ? 0.18 : 1;
    ctx.beginPath(); ctx.arc(n.x, n.y, rr, 0, Math.PI*2);
    ctx.fillStyle = COLORS[n.group] || '#888'; ctx.fill();
    if (n===selected){ ctx.lineWidth = 2.5/cam.k; ctx.strokeStyle = '#fff'; ctx.stroke(); }
    else if (n===hover){ ctx.lineWidth = 1.8/cam.k; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke(); }
    // labels: when zoomed in, or important/selected/neighbour
    const showLabel = cam.k > 1.05 || n===selected || n===hover || (selected && neigh.has(n.id)) || n.deg >= 7;
    if (showLabel && !dim){
      ctx.globalAlpha = 1;
      ctx.font = `${11/cam.k}px -apple-system,sans-serif`;
      ctx.fillStyle = 'rgba(230,237,243,0.9)';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(n.label, n.x + rr + 3/cam.k, n.y);
    }
    ctx.globalAlpha = 1;
  });
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---- picking & interaction ----
let dragNode = null, panning = false, last = null, downPos = null, moved = false;
function pick(px, py){
  const w = world(px, py); let best = null, bestD = 1e9;
  for (const n of nodes){
    if (hidden.has(n.group)) continue;
    const dx = n.x-w.x, dy = n.y-w.y, d = dx*dx+dy*dy;
    const rr = radius(n)+4;
    if (d < rr*rr && d < bestD){ best = n; bestD = d; }
  }
  return best;
}
cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect(); const px = e.clientX-r.left, py = e.clientY-r.top;
  downPos = {px, py}; moved = false;
  const n = pick(px, py);
  if (n){ dragNode = n; alpha = Math.max(alpha, 0.3); }
  else { panning = true; last = {x:e.clientX, y:e.clientY}; }
});
window.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(); const px = e.clientX-r.left, py = e.clientY-r.top;
  if (downPos && (Math.abs(px-downPos.px)+Math.abs(py-downPos.py) > 4)) moved = true;
  if (dragNode){ const w = world(px,py); dragNode.x = w.x; dragNode.y = w.y; dragNode.vx=0; dragNode.vy=0; return; }
  if (panning){ cam.x += e.clientX-last.x; cam.y += e.clientY-last.y; last = {x:e.clientX, y:e.clientY}; return; }
  // hover
  const n = pick(px, py); const tip = document.getElementById('tip');
  if (n){
    hover = n;
    tip.style.display='block'; tip.style.left=(px+14)+'px'; tip.style.top=(py+14)+'px';
    tip.innerHTML = `<div class="tn" style="color:${COLORS[n.group]}">${n.label}</div><div class="td">${n.desc}</div>`;
  } else { hover = null; tip.style.display='none'; }
});
window.addEventListener('mouseup', e => {
  if (dragNode && !moved) selectNode(dragNode);
  else if (panning && !moved){ selectNode(null); }
  dragNode = null; panning = false; downPos = null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(); const px = e.clientX-r.left, py = e.clientY-r.top;
  const before = world(px, py);
  cam.k *= e.deltaY < 0 ? 1.12 : 0.89; cam.k = Math.max(0.18, Math.min(4, cam.k));
  const after = world(px, py);
  cam.x += (after.x-before.x)*cam.k; cam.y += (after.y-before.y)*cam.k;
}, {passive:false});

// ---- selection + detail panel ----
function selectNode(n){
  selected = n;
  const d = document.getElementById('detail');
  if (!n){ d.classList.remove('show'); d.innerHTML=''; return; }
  const outs = links.filter(l => l.source.id===n.id).map(l => ({dir:'→', other:l.target, r:l.r}));
  const ins  = links.filter(l => l.target.id===n.id).map(l => ({dir:'←', other:l.source, r:l.r}));
  const relRow = x => `<div class="rel"><b>${x.dir} ${x.other.label}</b> <span class="r">${x.r}</span></div>`;
  d.innerHTML = `
    <span class="dgrp" style="background:${COLORS[n.group]}22;color:${COLORS[n.group]}">${GROUP_LABEL[n.group]||n.group}</span>
    <h2>${n.label}</h2>
    <div class="file">${n.file}</div>
    <div class="desc">${n.desc}</div>
    ${n.trace?`<a class="tracelink" href="${n.trace}" target="_blank">📄 View full line-by-line trace →</a>`:''}
    ${outs.length?`<div class="relhd">Depends on / calls (${outs.length})</div>`+outs.map(relRow).join(''):''}
    ${ins.length?`<div class="relhd">Used by (${ins.length})</div>`+ins.map(relRow).join(''):''}
  `;
  d.classList.add('show');
  // clicking a relationship row focuses that node
  d.querySelectorAll('.rel').forEach((el,i) => {
    const all = outs.concat(ins);
    el.style.cursor='pointer';
    el.onclick = () => selectNode(all[i].other);
  });
}

// ---- legend ----
const counts = {}; nodes.forEach(n => counts[n.group]=(counts[n.group]||0)+1);
const legend = document.getElementById('legend');
Object.keys(GROUP_LABEL).forEach(g => {
  if (!counts[g]) return;
  const row = document.createElement('div'); row.className='leg'; row.dataset.g=g;
  row.innerHTML = `<span class="swatch" style="background:${COLORS[g]}"></span>${GROUP_LABEL[g]}<span class="cnt">${counts[g]}</span>`;
  row.onclick = () => {
    if (hidden.has(g)){ hidden.delete(g); row.classList.remove('off'); }
    else { hidden.add(g); row.classList.add('off'); }
    alpha = Math.max(alpha, 0.4);
  };
  legend.appendChild(row);
});

// ---- search ----
const search = document.getElementById('search'), results = document.getElementById('results');
search.addEventListener('input', () => {
  const q = search.value.toLowerCase().trim(); results.innerHTML='';
  if (!q) return;
  nodes.filter(n => n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))
    .slice(0,12).forEach(n => {
      const el = document.createElement('div');
      el.innerHTML = `<span style="color:${COLORS[n.group]}">●</span> ${n.label}`;
      el.onclick = () => { focusNode(n); search.value=''; results.innerHTML=''; };
      results.appendChild(el);
    });
});
function focusNode(n){
  selectNode(n);
  const s = screen(n.x, n.y);
  cam.x += cv.clientWidth/2 - s.x; cam.y += cv.clientHeight/2 - s.y;
  cam.k = Math.max(cam.k, 1.1);
}
document.getElementById('resetView').onclick = () => {
  cam.k=0.75; cam.x = cv.clientWidth/2-(W0/2)*cam.k; cam.y = cv.clientHeight/2-(H0/2)*cam.k; alpha=0.6;
};
document.getElementById('clearSel').onclick = () => selectNode(null);

// ---- stats footer ----
document.getElementById('stat').textContent = `${nodes.length} nodes · ${links.length} edges`;
</script>
</body>
